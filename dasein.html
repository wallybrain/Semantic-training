<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASEIN :: Philosophical Text Navigator</title>
    <meta name="description" content="Navigate Hegel's Phenomenology of Spirit through dialogue with an AI guide.">
    <link rel="preload" href="fonts/VT323-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'VT323';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(fonts/VT323-Regular.woff2) format('woff2');
        }
        @font-face {
            font-family: 'Courier Prime';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(fonts/CourierPrime-Regular.woff2) format('woff2');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 20px;
        }

        :root {
            --bg: #0a0a0a;
            --green: #66d9a0;
            --green-dim: #5cb88a;
            --green-dark: #4d9968;
            --mono: 'VT323', monospace;
            --mono-alt: 'Courier Prime', monospace;
        }

        body {
            background: var(--bg);
            color: var(--green);
            font-family: var(--mono);
            font-size: 18px;
            line-height: 1.6;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(102, 217, 160, 0.02) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 80px;
            background: linear-gradient(to bottom, transparent, rgba(102, 217, 160, 0.08), transparent);
            pointer-events: none;
            z-index: 99;
            animation: scanline 6s linear infinite;
            opacity: 0.4;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        :focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Nav bar */
        .nav-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            font-size: 13px;
            color: var(--green-dark);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            background: rgba(10, 10, 10, 0.85);
            border-bottom: 1px solid rgba(102, 217, 160, 0.1);
            z-index: 50;
        }

        .nav-left, .nav-right {
            display: flex;
            gap: 10px;
        }

        .nav-bar a {
            color: var(--green-dark);
            text-decoration: none;
            transition: all 0.15s ease-out;
        }

        .nav-bar a:hover {
            color: var(--green);
            text-shadow: 0 0 6px rgba(102, 217, 160, 0.3);
        }

        /* Conversation pane */
        #conversation {
            flex: 1;
            overflow-y: auto;
            padding: 50px 15px 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--green-dark) transparent;
        }

        #conversation::-webkit-scrollbar {
            width: 6px;
        }

        #conversation::-webkit-scrollbar-track {
            background: transparent;
        }

        #conversation::-webkit-scrollbar-thumb {
            background: var(--green-dark);
            border-radius: 3px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 20px;
            font-family: var(--mono-alt);
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message--user {
            color: var(--green);
            padding-left: 20px;
            position: relative;
        }

        .message--user::before {
            content: '>';
            position: absolute;
            left: 0;
            color: var(--green-dim);
        }

        .message--assistant {
            color: var(--green-dim);
            text-shadow: 0 0 8px rgba(102, 217, 160, 0.15);
        }

        .message--system {
            color: var(--green-dark);
            text-align: center;
            font-family: var(--mono);
            font-size: 14px;
        }

        .message--error {
            color: #d96666;
            text-align: center;
            font-family: var(--mono);
            font-size: 14px;
        }

        /* Trail line */
        #trail {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--green-dark);
            background: rgba(102, 217, 160, 0.05);
            border-top: 1px solid rgba(102, 217, 160, 0.1);
            border-bottom: 1px solid rgba(102, 217, 160, 0.1);
            padding: 4px 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            min-height: 24px;
        }

        /* Input area */
        .input-area {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border-top: 1px solid rgba(102, 217, 160, 0.1);
            flex-shrink: 0;
        }

        .input-prompt {
            color: var(--green-dim);
            margin-right: 8px;
            font-size: 16px;
            flex-shrink: 0;
        }

        #user-input {
            flex: 1;
            font-family: var(--mono-alt);
            font-size: 16px;
            background: transparent;
            border: none;
            color: var(--green);
            caret-color: var(--green);
            outline: none;
            min-height: 44px;
        }

        #user-input:disabled {
            opacity: 0.4;
        }

        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: var(--green);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 4px;
        }

        /* Status bar spacer + bar */
        .status-spacer {
            height: 28px;
            flex-shrink: 0;
        }

        .status {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            font-size: 12px;
            color: var(--green-dark);
            padding: 4px 15px;
            display: flex;
            justify-content: space-between;
            backdrop-filter: blur(8px);
            background: rgba(10, 10, 10, 0.85);
            border-top: 1px solid rgba(102, 217, 160, 0.1);
            z-index: 50;
        }

        /* Side scanners */
        @keyframes sideScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .side-scanner {
            position: fixed;
            top: 0;
            width: 2px;
            height: 80px;
            pointer-events: none;
            z-index: 98;
            animation: sideScan 10s linear infinite;
            opacity: 0.3;
        }

        .side-scanner--left {
            left: 0;
            background: linear-gradient(to bottom, transparent 0%, var(--green) 50%, transparent 100%);
            box-shadow: 0 0 4px var(--green-dark);
        }

        .side-scanner--right {
            right: 0;
            background: linear-gradient(to bottom, transparent 0%, var(--green) 50%, transparent 100%);
            box-shadow: 0 0 4px var(--green-dark);
            animation-delay: -5s;
        }

        .side-glow {
            position: fixed;
            top: 0;
            width: 1px;
            height: 100%;
            pointer-events: none;
            z-index: 97;
            background: var(--green-dark);
            opacity: 0.15;
        }

        .side-glow--left { left: 0; box-shadow: 0 0 3px var(--green-dark); }
        .side-glow--right { right: 0; box-shadow: 0 0 3px var(--green-dark); }

        @media (max-width: 768px) {
            .message { font-size: 14px; }
            #user-input { font-size: 16px; }
            .nav-bar a {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                font-size: 14px;
            }
            .nav-bar { padding: 4px 10px; }
        }

        @media (max-width: 480px) {
            .message { font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-left">
        <a href="https://wallybrain.net">[wallybrain]</a>
    </div>
    <div class="nav-right">
        <a href="/">[home]</a>
        <a href="fnord.html">[fnord]</a>
        <a href="library.html">[antilibrary]</a>
        <a href="synth.html">[synth]</a>
        <a href="https://solitaire.wallybrain.icu">[solitaire]</a>
        <a href="zork.html">[zork]</a>
        <a href="dasein.html">[dasein]</a>
        <a href="https://cloud.wallyblanchard.com">[cloud]</a>
        <a href="https://code.wallyblanchard.com">[IDE]</a>
    </div>
</div>

<div id="conversation"></div>

<div id="trail"></div>

<div class="input-area">
    <span class="input-prompt">&gt;</span>
    <input type="text" id="user-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="begin the dialectic...">
    <span class="cursor-blink"></span>
</div>

<div class="status-spacer"></div>

<div class="status">
    <span>DASEIN v1.0 // HEGEL — PHENOMENOLOGY OF SPIRIT</span>
    <span id="exchange-count">exchanges: 0</span>
</div>

<div class="side-scanner side-scanner--left"></div>
<div class="side-scanner side-scanner--right"></div>
<div class="side-glow side-glow--left"></div>
<div class="side-glow side-glow--right"></div>

<script src="js/dasein.js"></script>
</body>
</html>
